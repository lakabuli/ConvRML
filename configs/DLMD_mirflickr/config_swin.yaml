gpu_setup:
  gpu_visible_id: "1"      # Which gpus are visible to your device
  gpu_num: 0            # For single gpu training, choose which gpu to use.
  num_workers: 4
  parallel: False

# Inference-only overrides (lets you run on a different GPU / save subset of ids)
infer:
  gpu_visible_id: "0"     
  gpu_num: 0            
  batch_size: 1        
  save_ids: [2, 65, 94, 196, 913]            # list of numeric ids to save (e.g. [64, 915]); Note for mirflickr/DLMD dataset the images are offset by 1.
  save_uncropped: False   # whether to save the full uncropped output
  save_metrics: True
  save_infer_dir: "./infer_results"

modes:
  wandb_on: True      
  full_fov_loss: False
  img_number: 65    # for loading sample image for wandb visualization. 

checkpoint:
  load_checkpoint: False
  load_path: ""         
  wandb_id: ""    # TODO: if loading checkpoint, specify wandb id (eg: "qt8qezs1") to continue logging to same run. Otherwise, leave as None for new run.
  project_name: "convrml"
  save_checkpoint_path: "./checkpoints/"
  save_intermediate: True
  save_freq: 5     # saves models every n epochs, in addition to saving best and latest models

dataset:
  name: "mirflickr"
  downsize_factor: 4       
  use_processed: True          # True means we are using preprocessed ground truth data (x4 downsampled and GT is in imager space)
  data_path: ""  # TODO: REPLACE with path to the mirflickr dataset directory containing ground truth and measurements

dataloader: 
  batch_size: 6
  lr: 5e-4
  warmup_epochs: 10
  
model:
  type: "swin"       # options are "convnext", "basic_transformer", "swin"
  alpha: 0
  num_epochs: 35
  input_height: 270    
  input_width: 480
  output_height: 270
  output_width: 480
  n_channels: 3
  num_heads_swin: [4, 8, 16, 32]
  num_blocks: 6
  embed_dim: 128            # dimension of embedding/hidden layer in Transformer
  patch_size: [15, 15]           # for x4 downsample: height = 300, width = 480. 300/15, 480/15 = 20 patches, 32 patches.
  ffn_multiplier: 2
  dropout_rate: 0.1




